<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Folio · Tu biblioteca</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3EFE6">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#F3EFE6;
  --ink:#221C16;
  --ink-soft:#6B6155;
  --card:#FCFAF4;
  --line:#DDD5C6;
  --green:#2E5641;
  --green-soft:#E3EBE4;
  --ribbon:#8C3B2E;
  --radius:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces",Georgia,serif;
  --serif:"Literata",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- App shell ---------- */
.shell{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.appbar{
  padding:calc(env(safe-area-inset-top) + 18px) 20px 12px;
  display:flex;align-items:baseline;justify-content:space-between;
}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.brand .dot{color:var(--green)}
.appbar-action{
  font-size:13px;font-weight:600;color:var(--green);
  padding:6px 12px;border:1.5px solid var(--green);border-radius:99px;
}
main{flex:1;padding:0 20px 96px}

/* ---------- Tabs ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:8px;
  padding:8px 16px calc(env(safe-area-inset-bottom) + 8px);
}
.tab{
  flex:1;max-width:200px;padding:10px 0;border-radius:10px;
  font-size:13px;font-weight:600;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.active{color:var(--green);background:var(--green-soft)}

/* ---------- Library ---------- */
.section-label{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-soft);margin:18px 0 12px;
}
.empty{
  text-align:center;padding:64px 24px;color:var(--ink-soft);
}
.empty .big{font-family:var(--display);font-size:21px;color:var(--ink);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.bookcard{position:relative;cursor:pointer}
.cover{
  position:relative;aspect-ratio:2/3;border-radius:6px 10px 10px 6px;overflow:hidden;
  box-shadow:0 2px 5px rgba(34,28,22,.18),0 8px 18px rgba(34,28,22,.10);
  background:var(--card);
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22)}
/* Generated typographic cover */
.gen{
  width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:16px 14px 14px 20px;color:#F6F1E7;
}
.gen .gt{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.gen .ga{font-size:11px;opacity:.85;font-style:italic;font-family:var(--serif)}
.c0{background:linear-gradient(160deg,#2E5641,#1C3A2B)}
.c1{background:linear-gradient(160deg,#5A3B2E,#3A2118)}
.c2{background:linear-gradient(160deg,#34465C,#1F2B3A)}
.c3{background:linear-gradient(160deg,#6B5430,#473518)}
.c4{background:linear-gradient(160deg,#54344E,#342030)}
/* Ribbon bookmark = progress */
.ribbon{
  position:absolute;top:0;right:12px;width:13px;
  background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:height .3s ease;
}
.bookmeta{margin-top:9px;padding-right:4px}
.bt{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ba{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{font-size:11px;color:var(--green);font-weight:700;margin-top:3px}
.del{
  position:absolute;top:6px;left:13px;z-index:2;
  width:26px;height:26px;border-radius:50%;
  background:rgba(20,17,14,.55);color:#fff;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
}

/* ---------- Search ---------- */
.searchrow{display:flex;gap:8px;margin-top:6px}
.searchbox{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;
}
.searchbox input{flex:1;border:none;outline:none;background:none;font-size:15px}
.searchbox svg{width:17px;height:17px;stroke:var(--ink-soft);fill:none;stroke-width:2;flex-shrink:0}
.langsel{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:0 10px;font-size:13px;font-weight:600;outline:none;
}
.results{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.result{
  display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px;align-items:center;
}
.rcover{
  width:52px;height:78px;border-radius:3px 5px 5px 3px;overflow:hidden;flex-shrink:0;
  box-shadow:0 2px 6px rgba(34,28,22,.2);background:#ddd;
}
.rcover img{width:100%;height:100%;object-fit:cover;display:block}
.rcover .gen{padding:7px 6px 6px 9px}
.rcover .gt{font-size:8px;-webkit-line-clamp:5}
.rcover .ga{display:none}
.rinfo{flex:1;min-width:0}
.rt{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ra{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.rl{font-size:11px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.dl{
  flex-shrink:0;padding:9px 14px;border-radius:99px;font-size:12.5px;font-weight:700;
  background:var(--green);color:#F3EFE6;min-width:96px;text-align:center;
}
.dl.have{background:var(--green-soft);color:var(--green)}
.dl:disabled{opacity:.6}
.hint{color:var(--ink-soft);font-size:13px;text-align:center;margin-top:14px;line-height:1.5}

/* ---------- Reader ---------- */
#reader{
  position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  background:var(--r-bg,#F3EFE6);color:var(--r-ink,#221C16);
}
#reader.open{display:flex}
#reader[data-theme="papel"]{--r-bg:#F3EFE6;--r-ink:#221C16;--r-soft:#857A6B;--r-line:#DFD7C8;--r-chrome:#FCFAF4}
#reader[data-theme="sepia"]{--r-bg:#E9DCC2;--r-ink:#41331F;--r-soft:#8A7757;--r-line:#D4C5A4;--r-chrome:#F2E8D3}
#reader[data-theme="noche"]{--r-bg:#131211;--r-ink:#D9D2C4;--r-soft:#7E7668;--r-line:#2B2823;--r-chrome:#1C1A18}
.rbar{
  display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  background:var(--r-chrome);border-bottom:1px solid var(--r-line);
}
.rbar button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.rbar svg{width:21px;height:21px;stroke:var(--r-ink);fill:none;stroke-width:1.9}
.rtitle{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--r-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.pbar{height:3px;background:var(--r-line)}
.pbar i{display:block;height:100%;background:var(--green);width:0%;transition:width .2s}
#reader[data-theme="noche"] .pbar i{background:#6FA083}
#rscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#rcontent{
  max-width:var(--r-width,620px);margin:0 auto;
  padding:30px 22px calc(env(safe-area-inset-bottom) + 90px);
  font-family:var(--serif);
  font-size:var(--r-size,18px);
  line-height:var(--r-lh,1.7);
}
#rcontent p{margin:0 0 1em;text-align:left;hyphens:auto;overflow-wrap:break-word}
#rcontent h3{
  font-family:var(--display);font-weight:700;font-size:1.25em;
  margin:2.2em 0 1em;line-height:1.25;
}
#rcontent .verse{white-space:pre-wrap}
.rfoot{
  position:absolute;bottom:0;left:0;right:0;pointer-events:none;
  text-align:center;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);
  font-size:11.5px;font-weight:600;color:var(--r-soft);
  background:linear-gradient(transparent,var(--r-bg) 55%);
}

/* ---------- Settings sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(20,17,14,.4);display:none}
.sheet-bg.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;display:none;
  background:var(--r-chrome,#FCFAF4);color:var(--r-ink,#221C16);
  border-radius:18px 18px 0 0;padding:20px 22px calc(env(safe-area-inset-bottom) + 24px);
  max-width:640px;margin:0 auto;
  box-shadow:0 -8px 30px rgba(20,17,14,.18);
}
.sheet.open{display:block}
.sheet h4{font-family:var(--display);font-size:17px;margin-bottom:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.setlabel{font-size:13px;font-weight:600;color:var(--r-soft,#857A6B)}
.chips{display:flex;gap:8px}
.chip{
  padding:8px 14px;border-radius:99px;font-size:13px;font-weight:600;
  border:1.5px solid var(--r-line,#DFD7C8);color:inherit;
}
.chip.on{background:var(--green);border-color:var(--green);color:#F3EFE6}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--r-line,#DFD7C8);
  font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.stepper span{font-size:14px;font-weight:700;min-width:34px;text-align:center}

/* ---------- Toast & spinner ---------- */
#toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#221C16;color:#F3EFE6;padding:11px 20px;border-radius:99px;
  font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:99;
  pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{
  display:inline-block;width:13px;height:13px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;
}
.dl.have .spin{border-color:rgba(46,86,65,.3);border-top-color:var(--green)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="shell">
  <header class="appbar">
    <div class="brand">Folio<span class="dot">.</span></div>
    <div style="display:flex;gap:8px">
      <button class="appbar-action" id="btn-install" style="display:none;background:var(--green);color:#F3EFE6">Instalar</button>
      <button class="appbar-action" id="btn-import">Importar archivo</button>
    </div>
    <input type="file" id="file-input" accept=".txt,.epub" hidden>
  </header>

  <main>
    <!-- BIBLIOTECA -->
    <section id="view-library">
      <div class="section-label">Mi biblioteca</div>
      <div id="library-grid" class="grid"></div>
      <div id="library-empty" class="empty" style="display:none">
        <div class="big">Aún no hay libros</div>
        <p>Busca y descarga clásicos en la pestaña <b>Buscar</b>,<br>o importa tus propios .txt y .epub.</p>
      </div>
    </section>

    <!-- BUSCAR -->
    <section id="view-search" style="display:none">
      <div class="section-label">Descargar libros</div>
      <div class="searchrow">
        <div class="searchbox">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input id="search-input" type="search" placeholder="Título o autor… (ej. Quijote, Verne)" enterkeyhint="search">
        </div>
        <select class="langsel" id="search-lang">
          <option value="es">ES</option>
          <option value="en">EN</option>
          <option value="">Todos</option>
        </select>
      </div>
      <div id="results" class="results"></div>
      <p class="hint" id="search-hint">Catálogo de Project Gutenberg: más de 75.000 libros de dominio público, gratis y legales.</p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="library">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M9 3v18"/></svg>
      Biblioteca
    </button>
    <button class="tab" data-view="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      Buscar
    </button>
  </nav>
</div>

<!-- LECTOR -->
<div id="reader" data-theme="papel">
  <div class="rbar">
    <button id="r-back" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="rtitle" id="r-title"></div>
    <button id="r-settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/><circle cx="17" cy="12" r="2.4"/></svg></button>
  </div>
  <div class="pbar"><i id="r-progress"></i></div>
  <div id="rscroll"><div id="rcontent"></div></div>
  <div class="rfoot" id="r-percent"></div>
</div>

<!-- AJUSTES -->
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <h4>Ajustes de lectura</h4>
  <div class="setrow">
    <span class="setlabel">Tema</span>
    <div class="chips" id="theme-chips">
      <button class="chip on" data-theme="papel">Papel</button>
      <button class="chip" data-theme="sepia">Sepia</button>
      <button class="chip" data-theme="noche">Noche</button>
    </div>
  </div>
  <div class="setrow">
    <span class="setlabel">Tamaño</span>
    <div class="stepper">
      <button id="size-down" aria-label="Reducir">−</button>
      <span id="size-val">18</span>
      <button id="size-up" aria-label="Aumentar">+</button>
    </div>
  </div>
  <div class="setrow">
    <span class="setlabel">Interlineado</span>
    <div class="chips" id="lh-chips">
      <button class="chip" data-lh="1.5">Compacto</button>
      <button class="chip on" data-lh="1.7">Normal</button>
      <button class="chip" data-lh="1.9">Amplio</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
let toastTimer;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* ============ IndexedDB ============ */
let _db = null;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('folio-db', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('books', { keyPath: 'id' });
      r.result.createObjectStore('progress', { keyPath: 'id' });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }));
}
const putBook  = b  => tx('books', 'readwrite', s => s.put(b));
const getBook  = id => tx('books', 'readonly',  s => s.get(id));
const allBooks = () => tx('books', 'readonly',  s => s.getAll());
const delBook  = id => tx('books', 'readwrite', s => s.delete(id));
const putProg  = p  => tx('progress', 'readwrite', s => s.put(p));
const getProg  = id => tx('progress', 'readonly',  s => s.get(id));
const allProg  = () => tx('progress', 'readonly',  s => s.getAll());
const delProg  = id => tx('progress', 'readwrite', s => s.delete(id));

/* ============ Navegación ============ */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  $('#view-library').style.display = t.dataset.view === 'library' ? '' : 'none';
  $('#view-search').style.display  = t.dataset.view === 'search'  ? '' : 'none';
  if (t.dataset.view === 'library') renderLibrary();
}));

/* ============ Portada generada ============ */
function genCover(title, author) {
  const c = 'c' + (hash(title) % 5);
  return `<div class="gen ${c}"><div class="gt">${esc(title)}</div><div class="ga">${esc(author || '')}</div></div>`;
}

/* ============ Biblioteca ============ */
async function renderLibrary() {
  const [books, progs] = await Promise.all([allBooks(), allProg()]);
  const pmap = {}; progs.forEach(p => pmap[p.id] = p);
  books.sort((a, b) => (pmap[b.id]?.updatedAt || b.addedAt) - (pmap[a.id]?.updatedAt || a.addedAt));
  const grid = $('#library-grid');
  $('#library-empty').style.display = books.length ? 'none' : '';
  grid.innerHTML = books.map(b => {
    const pr = pmap[b.id];
    const pct = pr ? Math.round(pr.ratio * 100) : 0;
    const ribbonH = pr ? Math.max(14, Math.round(pr.ratio * 88)) : 0;
    const coverInner = b.coverUrl
      ? `<img src="${esc(b.coverUrl)}" alt="" loading="lazy" onerror="this.outerHTML=genCoverFallback(this)">`
      : genCover(b.title, b.author);
    return `<div class="bookcard" data-id="${b.id}">
      <button class="del" data-del="${b.id}" aria-label="Eliminar">×</button>
      <div class="cover" data-title="${esc(b.title)}" data-author="${esc(b.author || '')}">
        ${coverInner}<div class="spine"></div>
        ${ribbonH ? `<div class="ribbon" style="height:${ribbonH}%"></div>` : ''}
      </div>
      <div class="bookmeta">
        <div class="bt">${esc(b.title)}</div>
        <div class="ba">${esc(b.author || '')}</div>
        <div class="bp">${pct > 0 ? (pct >= 99 ? 'Terminado' : pct + '% leído') : 'Sin empezar'}</div>
      </div>
    </div>`;
  }).join('');
}
// Fallback si la imagen de portada remota falla
window.genCoverFallback = function(img) {
  const c = img.closest('.cover');
  return genCover(c.dataset.title, c.dataset.author);
};
$('#library-grid').addEventListener('click', async e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    const id = del.dataset.del;
    const b = await getBook(id);
    if (confirm(`¿Eliminar «${b.title}» de tu biblioteca?`)) {
      await delBook(id); await delProg(id); renderLibrary();
      toast('Libro eliminado');
    }
    return;
  }
  const card = e.target.closest('.bookcard');
  if (card) openReader(card.dataset.id);
});

/* ============ Búsqueda (Gutendex) ============ */
let searchTimer, lastQuery = '';
$('#search-input').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 450);
});
$('#search-input').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); e.target.blur(); } });
$('#search-lang').addEventListener('change', () => { if ($('#search-input').value.trim()) doSearch(); else loadPopular(); });

/* La API de Gutendex es inestable (errores frecuentes, respuestas lentas,
   CORS poco fiable): se intenta directo y por dos proxies, con timeout y 2 rondas. */
async function fetchJSON(url) {
  const candidates = [
    url,
    'https://corsproxy.io/?url=' + encodeURIComponent(url),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
  ];
  for (let round = 0; round < 2; round++) {
    for (const u of candidates) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 14000);
      try {
        const r = await fetch(u, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!r.ok) continue;
        const j = await r.json();
        if (j && Array.isArray(j.results)) return j;
      } catch (e) { clearTimeout(timer); }
    }
  }
  throw new Error('api-failed');
}
async function doSearch() {
  const q = $('#search-input').value.trim();
  if (!q) { loadPopular(); return; }
  lastQuery = q;
  const lang = $('#search-lang').value;
  $('#results').innerHTML = '<p class="hint"><span class="spin" style="border-color:rgba(0,0,0,.15);border-top-color:#2E5641"></span> Buscando… (el catálogo a veces tarda)</p>';
  try {
    let url = 'https://gutendex.com/books?search=' + encodeURIComponent(q);
    if (lang) url += '&languages=' + lang;
    const j = await fetchJSON(url);
    if (q !== lastQuery) return;
    renderResults(j.results || []);
  } catch (err) {
    if (q !== lastQuery) return;
    $('#results').innerHTML = '<p class="hint">El catálogo de Gutendex no responde ahora mismo (le pasa a menudo).<br>Espera un minuto y vuelve a intentarlo.</p>';
  }
}
async function loadPopular() {
  const lang = $('#search-lang').value;
  $('#results').innerHTML = '';
  try {
    let url = 'https://gutendex.com/books?sort=popular';
    if (lang) url += '&languages=' + lang;
    const j = await fetchJSON(url);
    if ($('#search-input').value.trim()) return;
    $('#results').innerHTML = '<div class="section-label" style="margin-top:4px">Populares' + (lang ? (lang === 'es' ? ' en español' : ' en inglés') : '') + '</div>';
    renderResults(j.results || [], true);
  } catch (e) { /* silencioso */ }
}
async function renderResults(results, append) {
  const usable = results.filter(b => pickFormat(b.formats));
  const have = new Set((await allBooks()).map(b => b.id));
  const html = usable.slice(0, 20).map(b => {
    const id = 'gb-' + b.id;
    const author = (b.authors[0] && b.authors[0].name) ? b.authors[0].name.split(', ').reverse().join(' ') : 'Anónimo';
    const cover = b.formats['image/jpeg']
      ? `<img src="${esc(b.formats['image/jpeg'])}" alt="" loading="lazy">`
      : genCover(b.title, author);
    const owned = have.has(id);
    return `<div class="result">
      <div class="rcover">${cover}</div>
      <div class="rinfo">
        <div class="rt">${esc(b.title)}</div>
        <div class="ra">${esc(author)}</div>
        <div class="rl">${(b.languages || []).join(', ')}</div>
      </div>
      <button class="dl ${owned ? 'have' : ''}" data-book='${esc(JSON.stringify({ id: b.id, title: b.title, author, cover: b.formats['image/jpeg'] || '', formats: b.formats }))}' ${owned ? 'disabled' : ''}>
        ${owned ? 'En biblioteca' : 'Descargar'}
      </button>
    </div>`;
  }).join('');
  const target = $('#results');
  if (append) target.innerHTML += html || '';
  else target.innerHTML = html || '<p class="hint">Sin resultados. Prueba con otro título o cambia el idioma.</p>';
}
$('#results').addEventListener('click', async e => {
  const btn = e.target.closest('.dl');
  if (!btn || btn.disabled) return;
  const meta = JSON.parse(btn.dataset.book);
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Descargando';
  try {
    await downloadGutenberg(meta);
    btn.classList.add('have');
    btn.textContent = 'En biblioteca';
    toast(`«${meta.title.slice(0, 40)}» añadido a tu biblioteca`);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Descargar';
    toast('Error al descargar. Inténtalo de nuevo.');
  }
});

/* Elige el mejor formato de texto plano disponible */
function pickFormat(formats) {
  const keys = Object.keys(formats || {});
  let k = keys.find(x => x.startsWith('text/plain') && /utf-?8/i.test(x));
  if (k) return { url: formats[k], enc: 'utf-8' };
  k = keys.find(x => x.startsWith('text/plain'));
  if (k) {
    const m = k.match(/charset=([\w-]+)/i);
    return { url: formats[k], enc: m ? m[1] : 'utf-8' };
  }
  return null;
}
/* Descarga con fallback de proxies CORS */
async function fetchBuffer(url) {
  const candidates = [
    url,
    'https://corsproxy.io/?url=' + encodeURIComponent(url),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
  ];
  for (const u of candidates) {
    try {
      const r = await fetch(u);
      if (r.ok) return await r.arrayBuffer();
    } catch (e) { /* siguiente */ }
  }
  throw new Error('download-failed');
}
async function downloadGutenberg(meta) {
  const fmt = pickFormat(meta.formats);
  const buf = await fetchBuffer(fmt.url);
  let text;
  try { text = new TextDecoder(fmt.enc).decode(buf); }
  catch (e) { text = new TextDecoder('utf-8').decode(buf); }
  const clean = normalizeText(stripGutenberg(text));
  if (!clean || clean.length < 200) throw new Error('empty');
  await putBook({
    id: 'gb-' + meta.id,
    title: meta.title,
    author: meta.author,
    coverUrl: meta.cover,
    text: clean,
    addedAt: Date.now()
  });
}

/* ============ Normalización de texto ============ */
function stripGutenberg(t) {
  let s = t.replace(/\r\n/g, '\n');
  const start = s.search(/\*{3} ?START OF[^\n]*\*{3}/i);
  if (start !== -1) s = s.slice(s.indexOf('\n', start) + 1);
  const end = s.search(/\*{3} ?END OF[^\n]*\*{3}/i);
  if (end !== -1) s = s.slice(0, end);
  return s.trim();
}
/* Convierte texto crudo en párrafos uniformes.
   - Une las líneas cortadas de cada párrafo.
   - Conserva saltos en bloques tipo verso (líneas cortas).
   - Marca como capítulos las líneas tipo "CAPÍTULO X". */
function normalizeText(raw) {
  const blocks = raw.split(/\n\s*\n+/);
  const out = [];
  for (let b of blocks) {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const maxLen = Math.max(...lines.map(l => l.length));
    const isHeading = lines.length <= 2 && maxLen < 60 &&
      /^(cap[íi]tulo|chapter|libro|parte|book|part|pr[óo]logo|ep[íi]logo|[IVXLC]+\.?$|\d+\.?$)/i.test(lines[0]);
    if (isHeading) { out.push('#' + lines.join(' — ')); continue; }
    const isVerse = lines.length >= 3 && maxLen < 55;
    if (isVerse) out.push('|' + lines.join('\n'));
    else out.push(lines.join(' ').replace(/\s+/g, ' '));
  }
  return out.join('\n\n');
}
/* Render uniforme: mismo aspecto para todos los libros */
function renderText(text) {
  return text.split('\n\n').map(p => {
    if (p[0] === '#') return `<h3>${esc(p.slice(1))}</h3>`;
    if (p[0] === '|') return `<p class="verse">${esc(p.slice(1))}</p>`;
    return `<p>${esc(p)}</p>`;
  }).join('');
}

/* ============ Importar archivos (.txt / .epub) ============ */
$('#btn-import').addEventListener('click', () => $('#file-input').click());
$('#file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  toast('<span class="spin"></span>Importando…', 60000);
  try {
    let book;
    if (/\.epub$/i.test(file.name)) book = await importEpub(file);
    else book = await importTxt(file);
    await putBook(book);
    renderLibrary();
    document.querySelector('.tab[data-view="library"]').click();
    toast(`«${book.title.slice(0, 40)}» importado`);
  } catch (err) {
    console.error(err);
    toast('No se pudo importar el archivo');
  }
});
async function importTxt(file) {
  const text = await file.text();
  return {
    id: 'local-' + Date.now(),
    title: file.name.replace(/\.txt$/i, ''),
    author: '',
    coverUrl: '',
    text: normalizeText(text.replace(/\r\n/g, '\n')),
    addedAt: Date.now()
  };
}
async function importEpub(file) {
  const zip = await JSZip.loadAsync(file);
  const containerXml = await zip.file('META-INF/container.xml').async('string');
  const opfPath = new DOMParser().parseFromString(containerXml, 'application/xml')
    .querySelector('rootfile').getAttribute('full-path');
  const opfXml = await zip.file(opfPath).async('string');
  const opf = new DOMParser().parseFromString(opfXml, 'application/xml');
  const DC = 'http://purl.org/dc/elements/1.1/';
  const title = (opf.getElementsByTagNameNS(DC, 'title')[0]?.textContent || file.name.replace(/\.epub$/i, '')).trim();
  const author = (opf.getElementsByTagNameNS(DC, 'creator')[0]?.textContent || '').trim();
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const manifest = {};
  opf.querySelectorAll('manifest > item').forEach(i =>
    manifest[i.getAttribute('id')] = { href: i.getAttribute('href'), type: i.getAttribute('media-type') || '' });
  const spine = [...opf.querySelectorAll('spine > itemref')]
    .map(i => manifest[i.getAttribute('idref')]).filter(Boolean);
  const parts = [];
  for (const item of spine) {
    if (!/html|xml/i.test(item.type)) continue;
    const f = zip.file(base + decodeURIComponent(item.href)) || zip.file(decodeURIComponent(item.href));
    if (!f) continue;
    const html = await f.async('string');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('p, h1, h2, h3, h4, blockquote, li').forEach(el => {
      const t = el.textContent.replace(/\s+/g, ' ').trim();
      if (!t) return;
      parts.push(/^H[1-4]$/.test(el.tagName) ? '#' + t : t);
    });
  }
  if (!parts.length) throw new Error('epub-empty');
  return {
    id: 'local-' + Date.now(),
    title, author, coverUrl: '',
    text: parts.join('\n\n'),
    addedAt: Date.now()
  };
}

/* ============ Lector ============ */
const prefs = Object.assign(
  { theme: 'papel', size: 18, lh: 1.7 },
  JSON.parse(localStorage.getItem('folio-prefs') || '{}')
);
let currentId = null, saveTimer = null;

function applyPrefs() {
  const r = $('#reader');
  r.dataset.theme = prefs.theme;
  $('#rcontent').style.setProperty('--r-size', prefs.size + 'px');
  $('#rcontent').style.fontSize = prefs.size + 'px';
  $('#rcontent').style.lineHeight = prefs.lh;
  $('#size-val').textContent = prefs.size;
  document.querySelectorAll('#theme-chips .chip').forEach(c => c.classList.toggle('on', c.dataset.theme === prefs.theme));
  document.querySelectorAll('#lh-chips .chip').forEach(c => c.classList.toggle('on', parseFloat(c.dataset.lh) === prefs.lh));
  localStorage.setItem('folio-prefs', JSON.stringify(prefs));
}
async function openReader(id) {
  const book = await getBook(id);
  if (!book) return;
  currentId = id;
  $('#r-title').textContent = book.title;
  $('#rcontent').innerHTML = renderText(book.text);
  applyPrefs();
  $('#reader').classList.add('open');
  document.body.style.overflow = 'hidden';
  const prog = await getProg(id);
  const sc = $('#rscroll');
  sc.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (prog && prog.ratio) sc.scrollTop = prog.ratio * (sc.scrollHeight - sc.clientHeight);
    updateProgressUI();
  }));
}
function closeReader() {
  saveProgressNow();
  $('#reader').classList.remove('open');
  document.body.style.overflow = '';
  $('#rcontent').innerHTML = '';
  currentId = null;
  renderLibrary();
}
function currentRatio() {
  const sc = $('#rscroll');
  const max = sc.scrollHeight - sc.clientHeight;
  return max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 0;
}
function updateProgressUI() {
  const r = currentRatio();
  $('#r-progress').style.width = (r * 100) + '%';
  $('#r-percent').textContent = Math.round(r * 100) + '%';
}
function saveProgressNow() {
  if (!currentId) return;
  putProg({ id: currentId, ratio: currentRatio(), updatedAt: Date.now() });
}
$('#rscroll').addEventListener('scroll', () => {
  updateProgressUI();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveProgressNow, 500);
}, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgressNow(); });
$('#r-back').addEventListener('click', closeReader);

/* Ajustes */
const openSheet = () => { $('#sheet').classList.add('open'); $('#sheet-bg').classList.add('open'); };
const closeSheet = () => { $('#sheet').classList.remove('open'); $('#sheet-bg').classList.remove('open'); };
$('#r-settings').addEventListener('click', openSheet);
$('#sheet-bg').addEventListener('click', closeSheet);
$('#theme-chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  prefs.theme = c.dataset.theme; applyPrefs();
});
$('#lh-chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  keepRatio(() => { prefs.lh = parseFloat(c.dataset.lh); applyPrefs(); });
});
$('#size-down').addEventListener('click', () => keepRatio(() => { prefs.size = Math.max(14, prefs.size - 1); applyPrefs(); }));
$('#size-up').addEventListener('click', () => keepRatio(() => { prefs.size = Math.min(28, prefs.size + 1); applyPrefs(); }));
/* Mantiene el punto de lectura al cambiar tamaño/interlineado */
function keepRatio(fn) {
  const r = currentRatio();
  fn();
  requestAnimationFrame(() => {
    const sc = $('#rscroll');
    sc.scrollTop = r * (sc.scrollHeight - sc.clientHeight);
    updateProgressUI();
  });
}

/* ============ PWA: service worker + instalación ============ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  $('#btn-install').style.display = '';
});
$('#btn-install').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  $('#btn-install').style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  $('#btn-install').style.display = 'none';
  toast('Folio instalada · ya la tienes en tu pantalla de inicio');
});

/* ============ Init ============ */
renderLibrary();
loadPopular();
</script>
