<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Folio · Tu biblioteca</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F3EFE6">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#F3EFE6;
  --ink:#221C16;
  --ink-soft:#6B6155;
  --card:#FCFAF4;
  --line:#DDD5C6;
  --green:#2E5641;
  --green-soft:#E3EBE4;
  --ribbon:#8C3B2E;
  --radius:16px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Fraunces",Georgia,serif;
  --serif:"Literata",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.5;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:inherit;color:inherit;-webkit-user-select:text;user-select:text}

/* ---------- App shell ---------- */
.shell{height:100%;display:flex;flex-direction:column}
.appbar{
  padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:7px}
.brand .dot{color:var(--green)}
.brand .ver{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.05em}
.appbar-btns{display:flex;gap:8px}
.appbar-action{
  font-size:15px;font-weight:700;color:var(--green);
  padding:0 18px;border:2px solid var(--green);border-radius:99px;
  height:46px;display:flex;align-items:center;
}
.appbar-action:active{background:var(--green-soft)}
.appbar-action.solid{background:var(--green);color:#F3EFE6}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px}

/* ---------- Tabs ---------- */
.tabbar{
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;gap:6px;
  padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);
  flex-shrink:0;
}
.tab{
  flex:1;max-width:240px;padding:11px 8px;border-radius:14px;
  font-size:13.5px;font-weight:700;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  min-height:64px;
}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab.active{color:var(--green);background:var(--green-soft)}
.tab:active{opacity:.7}

/* ---------- Library ---------- */
.section-label{
  font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);margin:16px 0 12px;
}
.empty{text-align:center;padding:64px 16px;color:var(--ink-soft)}
.empty .big{font-family:var(--display);font-size:26px;color:var(--ink);margin-bottom:12px}
.empty p{font-size:16px;line-height:1.6}
.grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:20px 18px;
  padding-bottom:28px;
}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
.bookcard{position:relative;cursor:pointer}
.cover{
  position:relative;aspect-ratio:2/3;border-radius:8px 12px 12px 8px;overflow:hidden;
  box-shadow:0 2px 6px rgba(34,28,22,.18),0 8px 20px rgba(34,28,22,.10);
  background:var(--card);
  transition:transform .15s;
}
.bookcard:active .cover{transform:scale(.97)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .spine{position:absolute;left:0;top:0;bottom:0;width:7px;background:rgba(0,0,0,.22)}
.gen{
  width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:16px 13px 13px 20px;color:#F6F1E7;
}
.gen .gt{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.gen .ga{font-size:11px;opacity:.85;font-style:italic;font-family:var(--serif)}
.c0{background:linear-gradient(160deg,#2E5641,#1C3A2B)}
.c1{background:linear-gradient(160deg,#5A3B2E,#3A2118)}
.c2{background:linear-gradient(160deg,#34465C,#1F2B3A)}
.c3{background:linear-gradient(160deg,#6B5430,#473518)}
.c4{background:linear-gradient(160deg,#54344E,#342030)}
.ribbon{
  position:absolute;top:0;right:13px;width:13px;
  background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
.del{
  position:absolute;top:8px;left:13px;z-index:2;
  width:34px;height:34px;border-radius:50%;
  background:rgba(20,17,14,.6);color:#fff;font-size:21px;line-height:1;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);
}
.bookmeta{margin-top:10px}
.bt{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ba{font-size:13px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp{font-size:13px;color:var(--green);font-weight:700;margin-top:4px}

/* ---------- Search ---------- */
.searchbox{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:0 18px;height:58px;margin-top:18px;
  transition:border-color .15s;
}
.searchbox:focus-within{border-color:var(--green)}
.searchbox input{flex:1;border:none;outline:none;background:none;font-size:17px;height:100%}
.searchbox input::placeholder{color:var(--ink-soft)}
.searchbox svg{width:22px;height:22px;stroke:var(--ink-soft);fill:none;stroke-width:2;flex-shrink:0}
.langchips{display:flex;gap:8px;margin:12px 0 4px}
.langchip{
  flex:1;height:46px;border-radius:99px;font-size:15px;font-weight:700;
  border:2px solid var(--line);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;background:var(--card);
}
.langchip.on{background:var(--green);border-color:var(--green);color:#F3EFE6}
.langchip:active{opacity:.8}
.hint{color:var(--ink-soft);font-size:14.5px;text-align:center;margin:14px 8px;line-height:1.6}
.results{display:flex;flex-direction:column;gap:12px;padding-bottom:28px}
.result{
  display:flex;gap:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;align-items:center;
}
.rcover{
  width:72px;height:108px;border-radius:5px 8px 8px 5px;overflow:hidden;flex-shrink:0;
  box-shadow:0 2px 6px rgba(34,28,22,.2);background:#E5DECF;display:flex;
}
.rcover img{width:100%;height:100%;object-fit:cover;display:block}
.rcover .gen{padding:8px 7px 7px 11px}
.rcover .gt{font-size:9px;-webkit-line-clamp:5}
.rcover .ga{display:none}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rt{font-weight:600;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ra{font-size:14px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.dl{
  flex-shrink:0;width:52px;height:52px;border-radius:50%;
  background:var(--green);color:#F3EFE6;
  display:flex;align-items:center;justify-content:center;
}
.dl svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2}
.dl.have{background:var(--green-soft);color:var(--green)}
.dl.na{background:transparent;border:2px solid var(--line);color:var(--ink-soft)}
.dl:active{opacity:.8}
.dl:disabled{opacity:.55}
.morebtn{
  width:100%;height:54px;border-radius:16px;border:2px dashed var(--line);
  font-size:15.5px;font-weight:700;color:var(--green);
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:transparent;margin-top:4px;
}
.morebtn:active{background:var(--green-soft)}
.morebtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.olnote{
  font-size:13px;color:var(--ink-soft);background:var(--green-soft);
  border-radius:12px;padding:12px 16px;line-height:1.5;
}

/* ---------- Reader ---------- */
#reader{
  position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
  background:var(--r-bg,#F3EFE6);color:var(--r-ink,#221C16);
}
#reader.open{display:flex}
#reader[data-theme="papel"]{--r-bg:#F3EFE6;--r-ink:#221C16;--r-soft:#857A6B;--r-line:#DFD7C8;--r-chrome:#FCFAF4}
#reader[data-theme="sepia"]{--r-bg:#E9DCC2;--r-ink:#41331F;--r-soft:#8A7757;--r-line:#D4C5A4;--r-chrome:#F2E8D3}
#reader[data-theme="noche"]{--r-bg:#131211;--r-ink:#D9D2C4;--r-soft:#7E7668;--r-line:#2B2823;--r-chrome:#1C1A18}
.rbar{
  display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:var(--r-chrome);border-bottom:1px solid var(--r-line);
  flex-shrink:0;
}
.rbar button{min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.rbar button:active{opacity:.6}
.rbar svg{width:24px;height:24px;stroke:var(--r-ink);fill:none;stroke-width:1.9}
.rtitle{flex:1;text-align:center;font-size:14.5px;font-weight:600;color:var(--r-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.pbar{height:3px;background:var(--r-line)}
.pbar i{display:block;height:100%;background:var(--green);width:0%;transition:width .2s}
#reader[data-theme="noche"] .pbar i{background:#6FA083}
#rscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#rcontent{
  margin:0 auto;max-width:640px;
  padding:30px 22px calc(env(safe-area-inset-bottom) + 100px);
  font-family:var(--serif);
  -webkit-user-select:text;user-select:text;
}
#rcontent p{margin:0 0 1em;hyphens:auto;overflow-wrap:break-word}
#rcontent h3{
  font-family:var(--display);font-weight:700;font-size:1.25em;
  margin:2.2em 0 1em;line-height:1.25;
}
#rcontent .verse{white-space:pre-wrap}
.rfoot{
  position:absolute;bottom:0;left:0;right:0;pointer-events:none;
  text-align:center;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);
  font-size:12.5px;font-weight:700;color:var(--r-soft);
  background:linear-gradient(transparent,var(--r-bg) 55%);
}

/* ---------- Settings sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(20,17,14,.4);display:none}
.sheet-bg.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;display:none;
  background:var(--r-chrome,#FCFAF4);color:var(--r-ink,#221C16);
  border-radius:22px 22px 0 0;padding:24px 20px calc(env(safe-area-inset-bottom) + 28px);
  max-width:640px;margin:0 auto;width:100%;
  box-shadow:0 -8px 30px rgba(20,17,14,.18);
}
.sheet.open{display:block}
.sheet h4{font-family:var(--display);font-size:20px;margin-bottom:20px;font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.setlabel{font-size:15px;font-weight:600;color:var(--r-soft,#857A6B)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  padding:0 18px;height:46px;border-radius:99px;font-size:15px;font-weight:700;
  border:2px solid var(--r-line,#DFD7C8);color:inherit;
  display:flex;align-items:center;background:transparent;
}
.chip.on{background:var(--green);border-color:var(--green);color:#F3EFE6}
.chip:active{opacity:.7}
.stepper{display:flex;align-items:center;gap:16px}
.stepper button{
  width:48px;height:48px;border-radius:50%;border:2px solid var(--r-line,#DFD7C8);
  font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:center;
}
.stepper button:active{opacity:.7}
.stepper span{font-size:17px;font-weight:700;min-width:42px;text-align:center}

/* ---------- Toast & spinner ---------- */
#toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#221C16;color:#F3EFE6;padding:14px 22px;border-radius:99px;
  font-size:14.5px;font-weight:600;opacity:0;transition:.25s;z-index:99;
  pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{
  display:inline-block;width:15px;height:15px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  animation:sp .7s linear infinite;vertical-align:-2px;
}
.spin.dark{border-color:rgba(46,86,65,.25);border-top-color:var(--green)}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="shell">
  <header class="appbar">
    <div class="brand">Folio<span class="dot">.</span><span class="ver">v4</span></div>
    <div class="appbar-btns">
      <button class="appbar-action solid" id="btn-install" style="display:none">Instalar</button>
      <button class="appbar-action" id="btn-import">Importar</button>
    </div>
    <input type="file" id="file-input" accept=".txt,.epub" hidden>
  </header>

  <main id="main">
    <!-- BIBLIOTECA -->
    <section id="view-library">
      <div class="section-label">Mi biblioteca</div>
      <div id="library-grid" class="grid"></div>
      <div id="library-empty" class="empty" style="display:none">
        <div class="big">Aún no hay libros</div>
        <p>Busca y descarga en la pestaña <b>Buscar</b>,<br>o importa tus archivos .txt y .epub</p>
      </div>
    </section>

    <!-- BUSCAR -->
    <section id="view-search" style="display:none">
      <div class="searchbox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="search-input" type="search" placeholder="Título o autor…" enterkeyhint="search" autocomplete="off">
      </div>
      <div class="langchips" id="langchips">
        <button class="langchip" data-lang="es">Español</button>
        <button class="langchip" data-lang="en">English</button>
        <button class="langchip on" data-lang="">Todos</button>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-view="library">
      <svg viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14.5"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M9 3v18"/></svg>
      Biblioteca
    </button>
    <button class="tab" data-view="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      Buscar
    </button>
  </nav>
</div>

<!-- LECTOR -->
<div id="reader" data-theme="papel">
  <div class="rbar">
    <button id="r-back" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button>
    <div class="rtitle" id="r-title"></div>
    <button id="r-settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h16"/><circle cx="17" cy="12" r="2.4"/></svg></button>
  </div>
  <div class="pbar"><i id="r-progress"></i></div>
  <div id="rscroll"><div id="rcontent"></div></div>
  <div class="rfoot" id="r-percent"></div>
</div>

<!-- AJUSTES -->
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <h4>Ajustes de lectura</h4>
  <div class="setrow">
    <span class="setlabel">Tema</span>
    <div class="chips" id="theme-chips">
      <button class="chip on" data-theme="papel">Papel</button>
      <button class="chip" data-theme="sepia">Sepia</button>
      <button class="chip" data-theme="noche">Noche</button>
    </div>
  </div>
  <div class="setrow">
    <span class="setlabel">Tamaño</span>
    <div class="stepper">
      <button id="size-down" aria-label="Reducir">−</button>
      <span id="size-val">19</span>
      <button id="size-up" aria-label="Aumentar">+</button>
    </div>
  </div>
  <div class="setrow">
    <span class="setlabel">Interlineado</span>
    <div class="chips" id="lh-chips">
      <button class="chip" data-lh="1.5">Compacto</button>
      <button class="chip on" data-lh="1.7">Normal</button>
      <button class="chip" data-lh="1.9">Amplio</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
const VERSION = 4;

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fold = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const hash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
const DL_ICON = '<svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>';
const OK_ICON = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10"/></svg>';

/* ============ IndexedDB ============ */
let _db = null;
function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('folio-db', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('books', { keyPath: 'id' });
      r.result.createObjectStore('progress', { keyPath: 'id' });
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return db().then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const req = fn(t.objectStore(store));
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }));
}
const putBook  = b  => tx('books', 'readwrite', s => s.put(b));
const getBook  = id => tx('books', 'readonly',  s => s.get(id));
const allBooks = () => tx('books', 'readonly',  s => s.getAll());
const delBook  = id => tx('books', 'readwrite', s => s.delete(id));
const putProg  = p  => tx('progress', 'readwrite', s => s.put(p));
const getProg  = id => tx('progress', 'readonly',  s => s.get(id));
const allProg  = () => tx('progress', 'readonly',  s => s.getAll());
const delProg  = id => tx('progress', 'readwrite', s => s.delete(id));

/* ============ Navegación ============ */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  $('#view-library').style.display = t.dataset.view === 'library' ? '' : 'none';
  $('#view-search').style.display  = t.dataset.view === 'search'  ? '' : 'none';
  if (t.dataset.view === 'library') renderLibrary();
  else { ensureCatalog(currentLang() || 'es'); if (!$('#search-input').value.trim()) showPopular(); }
}));

/* ============ Portada generada ============ */
function genCover(title, author) {
  const c = 'c' + (hash(String(title)) % 5);
  return `<div class="gen ${c}"><div class="gt">${esc(title)}</div><div class="ga">${esc(author || '')}</div></div>`;
}
const gbCover = id => `https://www.gutenberg.org/cache/epub/${id}/pg${id}.cover.medium.jpg`;

/* ============ Biblioteca ============ */
async function renderLibrary() {
  const [books, progs] = await Promise.all([allBooks(), allProg()]);
  const pmap = {}; progs.forEach(p => pmap[p.id] = p);
  books.sort((a, b) => (pmap[b.id]?.updatedAt || b.addedAt) - (pmap[a.id]?.updatedAt || a.addedAt));
  const grid = $('#library-grid');
  $('#library-empty').style.display = books.length ? 'none' : '';
  grid.innerHTML = books.map(b => {
    const pr = pmap[b.id];
    const pct = pr ? Math.round(pr.ratio * 100) : 0;
    const ribbonH = pr && pr.ratio > 0.005 ? Math.max(14, Math.round(pr.ratio * 88)) : 0;
    const coverInner = b.coverUrl
      ? `<img src="${esc(b.coverUrl)}" alt="" loading="lazy" onerror="this.outerHTML=window.genCoverFallback(this)">`
      : genCover(b.title, b.author);
    return `<div class="bookcard" data-id="${esc(b.id)}">
      <button class="del" data-del="${esc(b.id)}" aria-label="Eliminar">×</button>
      <div class="cover" data-title="${esc(b.title)}" data-author="${esc(b.author || '')}">
        ${coverInner}<div class="spine"></div>
        ${ribbonH ? `<div class="ribbon" style="height:${ribbonH}%"></div>` : ''}
      </div>
      <div class="bookmeta">
        <div class="bt">${esc(b.title)}</div>
        <div class="ba">${esc(b.author || '')}</div>
        <div class="bp">${pct > 0 ? (pct >= 99 ? 'Terminado' : pct + '% leído') : 'Sin empezar'}</div>
      </div>
    </div>`;
  }).join('');
}

/* ============ Catálogo local (Gutenberg completo) ============
   catalog-es.json: TODOS los libros en español de Project Gutenberg (801)
   catalog-en.json: TODOS los libros en inglés (55.106) — carga perezosa
   Registro: [id, título, autor, tienePortada]                          */
const CAT = { es: null, en: null };
const CAT_LOADING = {};
async function ensureCatalog(lang) {
  if (!lang) { await ensureCatalog('es'); await ensureCatalog('en'); return; }
  if (CAT[lang]) return CAT[lang];
  if (CAT_LOADING[lang]) return CAT_LOADING[lang];
  CAT_LOADING[lang] = (async () => {
    const r = await fetch(`catalog-${lang}.json?v=${VERSION}`);
    const raw = await r.json();
    // precomputar texto plegado para búsqueda sin acentos
    for (const rec of raw) rec.push(fold(rec[1] + ' ' + rec[2]));
    CAT[lang] = raw;
    return raw;
  })();
  return CAT_LOADING[lang];
}

/* Búsqueda local instantánea con puntuación */
function searchLocal(q, lang) {
  const fq = fold(q.trim());
  if (!fq) return [];
  const langs = lang ? [lang] : ['es', 'en'];
  const out = [];
  for (const L of langs) {
    const cat = CAT[L];
    if (!cat) continue;
    const ftitleStart = fq;
    for (const rec of cat) {
      const hay = rec[4];
      const idx = hay.indexOf(fq);
      if (idx === -1) continue;
      let score = 1;
      if (hay.startsWith(ftitleStart)) score = 3;
      else if (idx === 0 || hay[idx - 1] === ' ' || hay[idx - 1] === '(') score = 2;
      out.push({ rec, lang: L, score: score + (L === 'es' ? 0.5 : 0) });
    }
  }
  out.sort((a, b) => b.score - a.score || a.rec[1].length - b.rec[1].length);
  return out.slice(0, 30);
}

/* ============ Open Library (todo lo que no está en Gutenberg) ============ */
const OL_LANG = { es: 'spa', en: 'eng' };
async function searchOpenLibrary(q, lang) {
  const lq = lang && OL_LANG[lang] ? q + ' language:' + OL_LANG[lang] : q;
  const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(lq) +
    '&fields=key,title,author_name,cover_i,ia,public_scan_b,first_publish_year,language&limit=20';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('ol-' + r.status);
    const j = await r.json();
    let docs = j.docs || [];
    if (lang && OL_LANG[lang]) docs = docs.filter(d => !d.language || d.language.includes(OL_LANG[lang]));
    return docs.map(d => ({
      key: d.key,
      title: d.title || '',
      author: (d.author_name && d.author_name[0]) || '',
      year: d.first_publish_year || '',
      cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '',
      ia: (d.ia && d.ia[0]) || '',
      free: !!(d.public_scan_b && d.ia && d.ia.length)
    }));
  } catch (e) {
    clearTimeout(timer);
    throw e;
  }
}

/* ============ Descargas ============ */
async function fetchTextChain(urls) {
  let lastErr;
  for (const u of urls) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const r = await fetch(u, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) { lastErr = new Error('http-' + r.status); continue; }
      const buf = await r.arrayBuffer();
      if (buf.byteLength < 500) { lastErr = new Error('too-small'); continue; }
      return new TextDecoder('utf-8').decode(buf);
    } catch (e) { clearTimeout(timer); lastErr = e; }
  }
  throw lastErr || new Error('download-failed');
}
const proxied = u => [
  u,
  'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  'https://corsproxy.io/?url=' + encodeURIComponent(u)
];

async function downloadGutenberg(meta) {
  const u1 = `https://www.gutenberg.org/ebooks/${meta.id}.txt.utf-8`;
  const u2 = `https://www.gutenberg.org/cache/epub/${meta.id}/pg${meta.id}.txt`;
  const text = await fetchTextChain([u1, u2, ...proxied(u1).slice(1)]);
  const clean = normalizeText(stripGutenberg(text));
  if (!clean || clean.length < 500) throw new Error('empty');
  await putBook({
    id: 'gb-' + meta.id,
    title: meta.title,
    author: meta.author,
    coverUrl: meta.hasCover ? gbCover(meta.id) : '',
    text: clean,
    addedAt: Date.now()
  });
}

async function downloadArchive(meta) {
  // 1) localizar el archivo de texto real del item (la API de metadatos sí tiene CORS)
  let fname = `${meta.ia}_djvu.txt`;
  try {
    const m = await (await fetch(`https://archive.org/metadata/${meta.ia}`)).json();
    const files = (m && m.files) || [];
    const f = files.find(x => x.format === 'DjVuTXT') ||
              files.find(x => /_djvu\.txt$/.test(x.name)) ||
              files.find(x => /\.txt$/.test(x.name) && !/meta/.test(x.name));
    if (f) fname = f.name;
    else throw Object.assign(new Error('Este escaneo no tiene texto extraído'), { user: true });
  } catch (e) { if (e.user) throw e; /* si la API falla, probamos el nombre estándar */ }
  const u = `https://archive.org/download/${meta.ia}/${encodeURIComponent(fname)}`;
  const text = await fetchTextChain(proxied(u));
  const clean = normalizeText(text.replace(/\r\n/g, '\n'));
  if (!clean || clean.length < 500) throw new Error('empty');
  await putBook({
    id: 'ol-' + meta.ia,
    title: meta.title,
    author: meta.author,
    coverUrl: meta.cover || '',
    text: clean,
    addedAt: Date.now()
  });
}

/* ============ Normalización de texto ============ */
function stripGutenberg(t) {
  let s = t.replace(/\r\n/g, '\n');
  const start = s.search(/\*{3} ?START OF[^\n]*\*{3}/i);
  if (start !== -1) s = s.slice(s.indexOf('\n', start) + 1);
  const end = s.search(/\*{3} ?END OF[^\n]*\*{3}/i);
  if (end !== -1) s = s.slice(0, end);
  return s.trim();
}
function normalizeText(raw) {
  const blocks = raw.split(/\n\s*\n+/);
  const out = [];
  for (const b of blocks) {
    const lines = b.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const maxLen = Math.max(...lines.map(l => l.length));
    const isHeading = lines.length <= 2 && maxLen < 60 &&
      /^(cap[íi]tulo|chapter|libro|parte|book|part|pr[óo]logo|ep[íi]logo|[IVXLC]+\.?$|\d+\.?$)/i.test(lines[0]);
    if (isHeading) { out.push('#' + lines.join(' — ')); continue; }
    const isVerse = lines.length >= 3 && maxLen < 55;
    if (isVerse) out.push('|' + lines.join('\n'));
    else out.push(lines.join(' ').replace(/\s+/g, ' '));
  }
  return out.join('\n\n');
}
function renderText(text) {
  return text.split('\n\n').map(p => {
    if (p[0] === '#') return `<h3>${esc(p.slice(1))}</h3>`;
    if (p[0] === '|') return `<p class="verse">${esc(p.slice(1))}</p>`;
    return `<p>${esc(p)}</p>`;
  }).join('');
}

async function importTxt(file) {
  const text = await file.text();
  return {
    id: 'local-' + Date.now(),
    title: file.name.replace(/\.txt$/i, ''),
    author: '',
    coverUrl: '',
    text: normalizeText(text.replace(/\r\n/g, '\n')),
    addedAt: Date.now()
  };
}
async function importEpub(file) {
  const zip = await JSZip.loadAsync(file);
  const containerXml = await zip.file('META-INF/container.xml').async('string');
  const opfPath = new DOMParser().parseFromString(containerXml, 'application/xml')
    .querySelector('rootfile').getAttribute('full-path');
  const opfXml = await zip.file(opfPath).async('string');
  const opf = new DOMParser().parseFromString(opfXml, 'application/xml');
  const DC = 'http://purl.org/dc/elements/1.1/';
  const title = (opf.getElementsByTagNameNS(DC, 'title')[0]?.textContent || file.name.replace(/\.epub$/i, '')).trim();
  const author = (opf.getElementsByTagNameNS(DC, 'creator')[0]?.textContent || '').trim();
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const manifest = {};
  opf.querySelectorAll('manifest > item').forEach(i =>
    manifest[i.getAttribute('id')] = { href: i.getAttribute('href'), type: i.getAttribute('media-type') || '' });
  const spine = [...opf.querySelectorAll('spine > itemref')]
    .map(i => manifest[i.getAttribute('idref')]).filter(Boolean);
  const parts = [];
  for (const item of spine) {
    if (!/html|xml/i.test(item.type)) continue;
    const f = zip.file(base + decodeURIComponent(item.href)) || zip.file(decodeURIComponent(item.href));
    if (!f) continue;
    const html = await f.async('string');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('p, h1, h2, h3, h4, blockquote, li').forEach(el => {
      const t = el.textContent.replace(/\s+/g, ' ').trim();
      if (!t) return;
      parts.push(/^H[1-4]$/.test(el.tagName) ? '#' + t : t);
    });
  }
  if (!parts.length) throw new Error('epub-empty');
  return {
    id: 'local-' + Date.now(),
    title, author, coverUrl: '',
    text: parts.join('\n\n'),
    addedAt: Date.now()
  };
}

async function openReader(id) {
  const book = await getBook(id);

  sc.scrollTop = 0;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (prog && prog.ratio) sc.scrollTop = prog.ratio * (sc.scrollHeight - sc.clientHeight);
    updateProgressUI();
  }));
}
function closeReader() {
  saveProgressNow();
  $('#reader').classList.remove('open');
  $('#rcontent').innerHTML = '';
  currentId = null;
  renderLibrary();

function currentRatio() {
  const sc = $('#rscroll');
  const max = sc.scrollHeight - sc.clientHeight;
  return max > 0 ? Math.min(1, Math.max(0, sc.scrollTop / max)) : 0;
}
function updateProgressUI() {
  const r = currentRatio();
  $('#r-progress').style.width = (r * 100) + '%';
  $('#r-percent').textContent = Math.round(r * 100) + '%';
}
function saveProgressNow() {
  if (!currentId) return;
  putProg({ id: currentId, ratio: currentRatio(), updatedAt: Date.now() });
}

$('#r-settings').addEventListener('click', openSheet);
$('#sheet-bg').addEventListener('click', closeSheet);
$('#theme-chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  prefs.theme = c.dataset.theme; applyPrefs();
});
$('#lh-chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  keepRatio(() => { prefs.lh = parseFloat(c.dataset.lh); applyPrefs(); });
});
$('#size-down').addEventListener('click', () => keepRatio(() => { prefs.size = Math.max(15, prefs.size - 1); applyPrefs(); }));
$('#size-up').addEventListener('click', () => keepRatio(() => { prefs.size = Math.min(30, prefs.size + 1); applyPrefs(); }));
function keepRatio(fn) {
  const r = currentRatio();
  fn();
  requestAnimationFrame(() => {
    const sc = $('#rscroll');
    sc.scrollTop = r * (sc.scrollHeight - sc.clientHeight);
    updateProgressUI();
  });
}

/* ============ PWA ============ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
}
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  $('#btn-install').style.display = '';
});
$('#btn-install').addEventListener('click', async () => {
  if (!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null;
  $('#btn-install').style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  $('#btn-install').style.display = 'none';
  toast('Folio instalada en tu pantalla de inicio');
});

/* ============ Aviso modo ordenador ============ */
(function () {
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isTouch && window.innerWidth >= 900) {
    const b = document.createElement('div');
    b.style.cssText = 'background:#8C3B2E;color:#fff;padding:14px 18px;font-size:15px;line-height:1.5;text-align:center';
    b.innerHTML = 'Parece que Chrome está en <b>modo ordenador</b> y la app se ve diminuta. Toca el menú <b>⋮</b> y desmarca «Versión para ordenador», luego recarga.';
    document.body.prepend(b);
  }
})();

/* ============ Init ============ */
renderLibrary();
ensureCatalog('es');

/* Ganchos para tests automatizados (no afectan al uso normal) */
window.__folio = { fold, searchLocal, ensureCatalog, normalizeText, stripGutenberg, renderText,
  downloadGutenberg, downloadArchive, searchOpenLibrary, putBook, getBook, allBooks, CAT, runSearch, showPopular };
</script>
